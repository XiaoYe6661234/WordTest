<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝牙联机单词接龙</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 头部 -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">🎮 蓝牙单词接龙</h1>
            <p class="text-blue-100 mt-1">双人本地联机对战</p>
        </div>

        <!-- 连接状态 -->
        <div id="connectionStatus" class="p-4 bg-gray-50 border-b">
            <div class="flex items-center justify-between">
                <span id="statusText" class="text-gray-600">未连接</span>
                <div id="connectionButtons" class="space-x-2">
                    <button id="hostBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
                        创建房间
                    </button>
                    <button id="joinBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                        加入房间
                    </button>
                </div>
            </div>
            <div id="deviceInfo" class="mt-2 text-sm text-gray-500 hidden"></div>
        </div>

        <!-- 游戏区域 -->
        <div id="gameArea" class="p-6 hidden">
            <!-- 游戏信息 -->
            <div class="mb-6 grid grid-cols-2 gap-4 text-center">
                <div class="bg-blue-50 p-3 rounded-lg">
                    <div class="text-sm text-gray-500">你的分数</div>
                    <div id="myScore" class="text-2xl font-bold text-blue-600">0</div>
                </div>
                <div class="bg-red-50 p-3 rounded-lg">
                    <div class="text-sm text-gray-500">对方分数</div>
                    <div id="opponentScore" class="text-2xl font-bold text-red-600">0</div>
                </div>
            </div>

            <!-- 当前单词 -->
            <div class="mb-6 text-center">
                <div class="text-sm text-gray-500 mb-1">当前单词</div>
                <div id="currentWord" class="text-3xl font-bold text-indigo-600 p-4 bg-indigo-50 rounded-xl">
                    等待游戏开始
                </div>
                <div id="nextLetter" class="mt-2 text-lg text-gray-600"></div>
            </div>

            <!-- 回合提示 -->
            <div id="turnIndicator" class="mb-4 p-3 rounded-lg text-center font-medium hidden">
                轮到你了！
            </div>

            <!-- 输入区域 -->
            <div id="inputArea" class="mb-6 hidden">
                <input 
                    type="text" 
                    id="wordInput" 
                    placeholder="输入单词..." 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                    autocomplete="off"
                >
                <button 
                    id="submitBtn" 
                    class="w-full mt-3 p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition font-medium"
                >
                    提交
                </button>
            </div>

            <!-- 游戏历史 -->
            <div class="mt-6">
                <div class="text-sm text-gray-500 mb-2">接龙历史</div>
                <div id="history" class="max-h-40 overflow-y-auto space-y-1 text-sm"></div>
            </div>

            <!-- 游戏控制 -->
            <div class="mt-6 flex space-x-3">
                <button id="startGameBtn" class="flex-1 p-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-medium">
                    开始游戏
                </button>
                <button id="disconnectBtn" class="flex-1 p-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium">
                    断开连接
                </button>
            </div>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 px-6 py-3 bg-gray-800 text-white rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none"></div>
    </div>

    <script>
        // 蓝牙服务和特征值UUID
        const SERVICE_UUID = '0000ffb0-0000-1000-8000-00805f9b34fb';
        const CHARACTERISTIC_UUID = '0000ffb2-0000-1000-8000-00805f9b34fb';

        // 游戏状态
        let isHost = false;
        let connected = false;
        let bluetoothDevice = null;
        let server = null;
        let service = null;
        let characteristic = null;
        let currentWord = '';
        let myTurn = false;
        let myScore = 0;
        let opponentScore = 0;
        let usedWords = new Set();

        // DOM元素
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const statusText = document.getElementById('statusText');
        const deviceInfo = document.getElementById('deviceInfo');
        const connectionButtons = document.getElementById('connectionButtons');
        const gameArea = document.getElementById('gameArea');
        const currentWordEl = document.getElementById('currentWord');
        const nextLetterEl = document.getElementById('nextLetter');
        const turnIndicator = document.getElementById('turnIndicator');
        const inputArea = document.getElementById('inputArea');
        const wordInput = document.getElementById('wordInput');
        const submitBtn = document.getElementById('submitBtn');
        const myScoreEl = document.getElementById('myScore');
        const opponentScoreEl = document.getElementById('opponentScore');
        const historyEl = document.getElementById('history');
        const startGameBtn = document.getElementById('startGameBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const messageEl = document.getElementById('message');

        // 显示消息
        function showMessage(text, duration = 2000) {
            messageEl.textContent = text;
            messageEl.classList.remove('opacity-0');
            messageEl.classList.add('opacity-100');
            
            setTimeout(() => {
                messageEl.classList.remove('opacity-100');
                messageEl.classList.add('opacity-0');
            }, duration);
        }

        // 更新连接状态
        function updateConnectionStatus(status, info = '') {
            statusText.textContent = status;
            if (info) {
                deviceInfo.textContent = info;
                deviceInfo.classList.remove('hidden');
            } else {
                deviceInfo.classList.add('hidden');
            }
        }

        // 发送数据
        async function sendData(data) {
            if (!characteristic) return;
            
            try {
                const encoder = new TextEncoder();
                const dataArray = encoder.encode(JSON.stringify(data));
                await characteristic.writeValue(dataArray);
            } catch (error) {
                console.error('发送数据失败:', error);
                showMessage('发送消息失败');
            }
        }

        // 处理接收到的数据
        function handleData(event) {
            const decoder = new TextDecoder();
            const data = JSON.parse(decoder.decode(event.target.value));
            
            switch (data.type) {
                case 'start':
                    startGame(false);
                    break;
                case 'word':
                    receiveWord(data.word);
                    break;
                case 'gameOver':
                    endGame(data.winner);
                    break;
            }
        }

        // 创建房间（主机）
        async function createRoom() {
            try {
                updateConnectionStatus('正在广播...');
                showMessage('请让对方点击"加入房间"搜索你的设备');
                
                // 请求蓝牙设备
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
                // 连接到GATT服务器
                server = await bluetoothDevice.gatt.connect();
                service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                // 启用通知
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                isHost = true;
                connected = true;
                
                updateConnectionStatus('已连接', `设备: ${bluetoothDevice.name}`);
                connectionButtons.classList.add('hidden');
                gameArea.classList.remove('hidden');
                startGameBtn.classList.remove('hidden');
                
                showMessage('连接成功！点击"开始游戏"开始对战');
            } catch (error) {
                console.error('创建房间失败:', error);
                updateConnectionStatus('未连接');
                showMessage('创建房间失败，请重试');
            }
        }

        // 加入房间（从机）
        async function joinRoom() {
            try {
                updateConnectionStatus('正在搜索...');
                
                // 请求蓝牙设备
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
                // 连接到GATT服务器
                server = await bluetoothDevice.gatt.connect();
                service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                // 启用通知
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                isHost = false;
                connected = true;
                
                updateConnectionStatus('已连接', `设备: ${bluetoothDevice.name}`);
                connectionButtons.classList.add('hidden');
                gameArea.classList.remove('hidden');
                startGameBtn.classList.add('hidden');
                
                showMessage('连接成功！等待主机开始游戏');
            } catch (error) {
                console.error('加入房间失败:', error);
                updateConnectionStatus('未连接');
                showMessage('加入房间失败，请重试');
            }
        }

        // 断开连接
        function onDisconnected() {
            connected = false;
            bluetoothDevice = null;
            server = null;
            service = null;
            characteristic = null;
            
            updateConnectionStatus('已断开');
            connectionButtons.classList.remove('hidden');
            gameArea.classList.add('hidden');
            
            showMessage('蓝牙连接已断开');
            resetGame();
        }

        // 重置游戏
        function resetGame() {
            currentWord = '';
            myTurn = false;
            myScore = 0;
            opponentScore = 0;
            usedWords.clear();
            
            currentWordEl.textContent = '等待游戏开始';
            nextLetterEl.textContent = '';
            myScoreEl.textContent = '0';
            opponentScoreEl.textContent = '0';
            historyEl.innerHTML = '';
            
            turnIndicator.classList.add('hidden');
            inputArea.classList.add('hidden');
        }

        // 开始游戏
        function startGame(isInitiator) {
            resetGame();
            
            if (isInitiator) {
                sendData({ type: 'start' });
                myTurn = false;
                showMessage('游戏开始！对方先出');
            } else {
                myTurn = true;
                turnIndicator.classList.remove('hidden');
                turnIndicator.textContent = '轮到你了！请输入第一个单词';
                inputArea.classList.remove('hidden');
                wordInput.focus();
                showMessage('游戏开始！你先出');
            }
        }

        // 提交单词
        function submitWord() {
            const word = wordInput.value.trim().toLowerCase();
            
            if (!word) {
                showMessage('请输入单词');
                return;
            }
            
            if (usedWords.has(word)) {
                showMessage('这个单词已经用过了');
                return;
            }
            
            if (currentWord && word[0] !== currentWord.slice(-1)) {
                showMessage(`单词必须以"${currentWord.slice(-1).toUpperCase()}"开头`);
                return;
            }
            
            // 发送单词给对方
            sendData({ type: 'word', word });
            
            // 更新本地状态
            currentWord = word;
            usedWords.add(word);
            myScore++;
            
            // 更新UI
            currentWordEl.textContent = word;
            nextLetterEl.textContent = `下一个单词请以"${word.slice(-1).toUpperCase()}"开头`;
            myScoreEl.textContent = myScore;
            
            // 添加到历史
            addToHistory(word, true);
            
            // 切换回合
            myTurn = false;
            turnIndicator.classList.add('hidden');
            inputArea.classList.add('hidden');
            wordInput.value = '';
            
            showMessage('等待对方回应...');
        }

        // 接收对方单词
        function receiveWord(word) {
            if (usedWords.has(word)) {
                // 对方使用了重复单词，你赢了
                sendData({ type: 'gameOver', winner: 'opponent' });
                endGame('you');
                return;
            }
            
            if (currentWord && word[0] !== currentWord.slice(-1)) {
                // 对方单词首字母错误，你赢了
                sendData({ type: 'gameOver', winner: 'opponent' });
                endGame('you');
                return;
            }
            
            // 更新本地状态
            currentWord = word;
            usedWords.add(word);
            opponentScore++;
            
            // 更新UI
            currentWordEl.textContent = word;
            nextLetterEl.textContent = `下一个单词请以"${word.slice(-1).toUpperCase()}"开头`;
            opponentScoreEl.textContent = opponentScore;
            
            // 添加到历史
            addToHistory(word, false);
            
            // 切换回合
            myTurn = true;
            turnIndicator.classList.remove('hidden');
            turnIndicator.textContent = '轮到你了！';
            inputArea.classList.remove('hidden');
            wordInput.focus();
            
            showMessage('轮到你了！');
        }

        // 添加到历史记录
        function addToHistory(word, isMine) {
            const item = document.createElement('div');
            item.className = isMine ? 'text-blue-600' : 'text-red-600';
            item.textContent = `${isMine ? '你' : '对方'}: ${word}`;
            historyEl.appendChild(item);
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // 游戏结束
        function endGame(winner) {
            myTurn = false;
            turnIndicator.classList.add('hidden');
            inputArea.classList.add('hidden');
            
            if (winner === 'you') {
                currentWordEl.textContent = '🎉 你赢了！';
                showMessage('恭喜你获胜！');
            } else {
                currentWordEl.textContent = '😢 你输了';
                showMessage('对方获胜');
            }
            
            nextLetterEl.textContent = '点击"开始游戏"重新开始';
        }

        // 事件监听
        hostBtn.addEventListener('click', createRoom);
        joinBtn.addEventListener('click', joinRoom);
        startGameBtn.addEventListener('click', () => startGame(true));
        disconnectBtn.addEventListener('click', () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            onDisconnected();
        });
        submitBtn.addEventListener('click', submitWord);
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitWord();
            }
        });

        // 检查浏览器支持
        if (!navigator.bluetooth) {
            updateConnectionStatus('不支持');
            connectionButtons.classList.add('hidden');
            showMessage('你的浏览器不支持Web Bluetooth API', 5000);
        }
    </script>
</body>
</html>
