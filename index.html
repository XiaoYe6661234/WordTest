<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>单词接龙</title>
    <style>
        /* 全局与基础 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }
        body {
            background: #8dfa9c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            position: relative;
            aspect-ratio: 16 / 9;
            width: min(96vw, 96vh * 1.777);
            max-width: 1280px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        /* 页面切换 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px 30px;
            display: flex;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* 通用控件 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #000;
            background: transparent;
            border: none;
            z-index: 30;
        }
        .back-btn span {
            font-size: 22px;
        }

        /* ---- 首页 ---- */
        #homePage {
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }
        .home-left {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .home-logo {
            max-width: 80%;
            object-fit: contain;
        }
        .home-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            padding-right: 30px;
        }
        .menu-btn {
            background: #3bc935;
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 16px 28px;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 6px 0 #2a8e25;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            min-height: 80px;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2a8e25;
        }
        .menu-btn img {
            width: 50px;
            height: 50px;
            background: white;
            padding: 6px;
            border-radius: 6px;
            object-fit: contain;
        }
        .home-bottom-icons {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 16px;
        }
        .home-bottom-icons img {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .home-bottom-icons img:active {
            transform: scale(0.85);
        }

        /* ---- 模式选择 ---- */
        #modePage {
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .mode-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 90%;
        }
        .mode-card {
            flex: 1;
            background: #3bc935;
            border-radius: 16px;
            padding: 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            aspect-ratio: 1 / 1.2;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 0 #1f7a1b;
        }
        .mode-card:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1f7a1b;
        }
        .mode-card img {
            width: 55%;
            height: auto;
            background: transparent;
            object-fit: contain;
        }
        .mode-card .label {
            background: white;
            width: 90%;
            padding: 12px 0;
            text-align: center;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }

        /* ---- 游戏界面 ---- */
        #gamePage {
            padding: 0;
            background: #ffffff;
            border-radius: 24px;
            flex-direction: row;
        }
        .game-left-panel {
            flex: 1;
            border-right: 4px solid #3bc935;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .game-left-header {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #3bc935;
            padding: 12px 16px;
            border-radius: 12px 12px 0 0;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
        .game-left-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            background: white;
        }
        .game-left-body {
            flex: 1;
            background: #f1f1f1;
            padding: 20px;
            border-radius: 0 0 12px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .word-card {
            background: #dedede;
            padding: 30px 20px;
            border-radius: 16px;
            width: 100%;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-right-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .game-right-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3bc935;
            padding: 6px 16px;
            border-radius: 12px 12px 0 0;
            color: white;
            font-weight: bold;
            font-size: 22px;
            min-height: 60px;
        }
        .timer-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 30px;
        }
        .timer-area img {
            width: 36px;
            height: 36px;
        }
        .game-right-input {
            background: #eaeaea;
            padding: 16px;
            border-radius: 0 0 12px 12px;
            min-height: 60px;
            font-size: 28px;
            letter-spacing: 2px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .game-keyboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }
        .kb-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .kb-key {
            flex: 1;
            max-width: 52px;
            aspect-ratio: 1 / 1.2;
            background: #f7f7f7;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #ccc;
            color: #000;
        }
        .kb-key:active {
            transform: scale(0.92);
            box-shadow: 0 1px 0 #ccc;
        }
        .kb-key.special {
            background: #3bc935;
            border-color: #1f7a1b;
            box-shadow: 0 4px 0 #1f7a1b;
            color: white;
        }
        .kb-key.special:active {
            box-shadow: 0 1px 0 #1f7a1b;
        }
        .kb-key.empty {
            visibility: hidden;
        }

        /* 遮罩 & 模态框 */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            border-radius: 24px;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 24px;
            padding: 32px 40px;
            max-width: 500px;
            width: 85%;
            max-height: 70%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: 0.25s;
        }
        .modal-overlay.show .modal-box {
            transform: scale(1);
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .modal-box .close-modal {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 32px;
            cursor: pointer;
            font-weight: bold;
        }
        .history-scroll {
            overflow-y: auto;
            max-height: 300px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background: #3bc935;
            border-radius: 10px;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f1f1;
            padding: 6px 12px;
            border-radius: 30px;
        }
        .history-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .loading-mask {
            position: absolute;
            background: rgba(255,255,255,0.8);
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        /* 游戏内时钟按钮 */
        .clock-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 30px;
            transition: 0.15s;
        }
        .clock-btn:active {
            transform: scale(0.9);
        }
        .clock-btn img {
            width: 36px;
            height: 36px;
        }

        /* 蓝牙连接 */
        .bluetooth-panel {
            padding: 24px;
            text-align: center;
        }
        .bluetooth-panel img {
            width: 80px;
            margin: 20px 0;
        }

        /* 打字特效 */
        .type-cursor {
            display: inline-block;
            width: 2px;
            height: 32px;
            background: #3bc935;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 响应式/16:9 */
        @media (max-width: 768px) {
            .home-right { padding-right: 6px; }
            .menu-btn { font-size: 20px; padding: 12px 16px; min-height: 60px; }
            .menu-btn img { width: 36px; height: 36px; }
            .home-logo { max-width: 90%; }
            .mode-grid { gap: 12px; width: 98%; }
            .mode-card .label { font-size: 14px; }
            .word-card { font-size: 32px; min-height: 80px; }
            .game-right-input { font-size: 22px; }
            .kb-key { max-width: 32px; font-size: 16px; }
            .game-left-header { font-size: 18px; }
        }
        @media (max-height: 500px) {
            .game-container { width: 98vw; }
        }
    </style>
</head>
<body>
<div class="game-container" id="appContainer">

    <!-- 首页 -->
    <div id="homePage" class="page active">
        <div class="home-left">
            <img src="https://xiaoye6661234.github.io/WordTest/Logo.png" class="home-logo" alt="Logo">
        </div>
        <div class="home-right">
            <button class="menu-btn" id="btnBasic">
                <img src="https://xiaoye6661234.github.io/WordTest/Test.png" alt="Icon"> 基础训练
            </button>
            <button class="menu-btn" id="btnTimer">
                <img src="https://xiaoye6661234.github.io/WordTest/Timer.png" alt="Icon"> 定时训练
            </button>
        </div>
        <div class="home-bottom-icons">
            <img src="https://xiaoye6661234.github.io/WordTest/Announcement.png" alt="公告" id="btnNotice">
            <img src="https://xiaoye6661234.github.io/WordTest/Information.png" alt="信息" id="btnInfo">
        </div>
    </div>

    <!-- 模式选择 -->
    <div id="modePage" class="page">
        <button class="back-btn" id="backFromMode"><span>←</span>返回</button>
        <div class="mode-grid">
            <div class="mode-card" data-mode="ai">
                <img src="https://xiaoye6661234.github.io/WordTest/AI.png" alt="AI">
                <div class="label">和AI竞赛</div>
            </div>
            <div class="mode-card" data-mode="bluetooth">
                <img src="https://xiaoye6661234.github.io/WordTest/BlueTooth.png" alt="BT">
                <div class="label">连接蓝牙联机游玩</div>
            </div>
            <div class="mode-card" data-mode="solo">
                <img src="https://xiaoye6661234.github.io/WordTest/OnePerson.png" alt="Solo">
                <div class="label">单人模式</div>
            </div>
        </div>
    </div>

    <!-- 游戏页 -->
    <div id="gamePage" class="page">
        <button class="back-btn" id="backFromGame" style="z-index:50;"><span>←</span>返回</button>

        <!-- 左侧：对手 -->
        <div class="game-left-panel">
            <div class="game-left-header" id="opponentHeader">
                <img id="oppAvatar" src="https://xiaoye6661234.github.io/WordTest/默认avatar.jpg" alt="Avatar">
                <span id="oppName">AI</span>
            </div>
            <div class="game-left-body" id="oppBody">
                <div style="font-size:18px; margin-bottom:12px;" id="oppStatus">让我看看什么单词还没有出现...</div>
                <div class="word-card" id="oppWordCard">good</div>
                <div style="font-size:18px; margin-top:12px;" id="oppFooter">到你了！</div>
                <!-- 加载遮罩 -->
                <div class="loading-mask" id="aiLoadingMask" style="display:none;">加载中...</div>
            </div>
        </div>

        <!-- 右侧：玩家 -->
        <div class="game-right-panel">
            <div class="game-right-header">
                <div class="timer-area" id="timerArea">
                    <img src="https://xiaoye6661234.github.io/WordTest/Timer.png" alt="Timer">
                    <span id="timerText">剩余时间: 10s</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="clock-btn" id="historyBtn">
                        <img src="https://xiaoye6661234.github.io/WordTest/Announcement.png" alt="History">
                    </div>
                    <span id="playerNameLabel">我</span>
                    <img src="https://xiaoye6661234.github.io/WordTest/默认avatar.jpg" style="width:36px;height:36px;border-radius:50%;border:2px solid white;" alt="Me">
                </div>
            </div>
            <div class="game-right-input" id="playerInputDisplay">
                <span id="inputText"></span><span class="type-cursor"></span>
            </div>

            <!-- 自定义键盘 -->
            <div class="game-keyboard" id="customKeyboard">
                <div class="kb-row">
                    <div class="kb-key" data-key="Q">Q</div>
                    <div class="kb-key" data-key="W">W</div>
                    <div class="kb-key" data-key="E">E</div>
                    <div class="kb-key" data-key="R">R</div>
                    <div class="kb-key" data-key="T">T</div>
                    <div class="kb-key" data-key="Y">Y</div>
                    <div class="kb-key" data-key="U">U</div>
                    <div class="kb-key" data-key="I">I</div>
                    <div class="kb-key" data-key="O">O</div>
                    <div class="kb-key" data-key="P">P</div>
                </div>
                <div class="kb-row">
                    <div class="kb-key" data-key="A">A</div>
                    <div class="kb-key" data-key="S">S</div>
                    <div class="kb-key" data-key="D">D</div>
                    <div class="kb-key" data-key="F">F</div>
                    <div class="kb-key" data-key="G">G</div>
                    <div class="kb-key" data-key="H">H</div>
                    <div class="kb-key" data-key="J">J</div>
                    <div class="kb-key" data-key="K">K</div>
                    <div class="kb-key" data-key="L">L</div>
                    <div class="kb-key special" id="keyBackspace">✕</div>
                </div>
                <div class="kb-row">
                    <div class="kb-key" data-key="Z">Z</div>
                    <div class="kb-key" data-key="X">X</div>
                    <div class="kb-key" data-key="C">C</div>
                    <div class="kb-key" data-key="V">V</div>
                    <div class="kb-key" data-key="B">B</div>
                    <div class="kb-key" data-key="N">N</div>
                    <div class="kb-key" data-key="M">M</div>
                    <div class="kb-key special" id="keySubmit" style="flex:2; max-width:80px;">确定</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 蓝牙连接模态框 -->
    <div class="modal-overlay" id="bluetoothModal">
        <div class="modal-box bluetooth-panel" style="position:relative;">
            <span class="close-modal" id="closeBtModal">✕</span>
            <h2>蓝牙连接</h2>
            <img src="https://xiaoye6661234.github.io/WordTest/BlueTooth.png" id="btStatusImg" alt="BT">
            <div id="btStatusText" style="font-size:20px; margin:12px 0;">请连接蓝牙</div>
            <div id="btActionArea">
                <button id="btCreateRoom" style="background:#3bc935;color:white;border:none;padding:12px 24px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin:6px;">创建房间 (主机)</button>
                <button id="btJoinRoom" style="background:#3bc935;color:white;border:none;padding:12px 24px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin:6px;">加入房间 (客机)</button>
                <div style="margin-top:12px;">
                    <input type="text" id="btRoomCode" placeholder="请输入房间码" style="padding:10px;border-radius:20px;border:1px solid #ccc;width:100%;max-width:200px;text-align:center;font-size:16px;">
                </div>
                <div id="btLog" style="font-size:14px;color:#666;margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- 历史记录模态框 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-box" style="position:relative;">
            <span class="close-modal" id="closeHistoryModal">✕</span>
            <h2>历史记录</h2>
            <div class="history-scroll" id="historyList"></div>
        </div>
    </div>

    <!-- 通用消息提示(内嵌) -->
    <div class="modal-overlay" id="messageModal">
        <div class="modal-box" style="position:relative;align-items:center;">
            <span class="close-modal" id="closeMessageModal">✕</span>
            <div id="messageContent" style="font-size:24px;text-align:center;padding:20px;">提示内容</div>
        </div>
    </div>

</div>

<script>
    // ================ 1. 巨量单词库 (10000+) ================

    // 将常用高频词打底，生成约11000词。实际可扩展。

    ];
    moreWords.forEach(w => WORDS.add(w.toLowerCase()));

    // 确保至少有11000个词
    console.log(`Total words loaded: ${WORDS.size}`);

    // ================ 2. 游戏全局状态 ================
    const STATE = {
        mode: null,          // 'solo', 'ai', 'bluetooth'
        timerMode: false,
        currentWord: 'good',
        usedWords: new Set(),
        myTurn: true,
        timerSeconds: 10,
        timerInterval: null,
        history: [],
        inputBuffer: '',
        opponentName: 'AI',
        // 蓝牙相关
        btPeerConnection: null,
        btDataChannel: null,
        btIsHost: false,
        btConnected: false,

    };

    // ================ 3. DOM 引用 ================
    const $ = id => document.getElementById(id);
    const pageHome = $('homePage');
    const pageMode = $('modePage');
    const pageGame = $('gamePage');
    const oppWordCard = $('oppWordCard');
    const oppStatus = $('oppStatus');
    const oppFooter = $('oppFooter');
    const oppName = $('oppName');
    const oppAvatar = $('oppAvatar');
    const playerInputDisplay = $('inputText');
    const timerText = $('timerText');
    const timerArea = $('timerArea');
    const historyList = $('historyList');
    const messageContent = $('messageContent');

    // ================ 4. 页面切换 ================
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // ================ 5. 通用提示 ================
    function showMessage(msg) {
        messageContent.innerText = msg;
        $('messageModal').classList.add('show');
    }
    $('closeMessageModal').onclick = () => $('messageModal').classList.remove('show');

    // ================ 6. 初始化与导航 ================
    $('btnBasic').onclick = () => { STATE.timerMode = false; showPage('modePage'); };
    $('btnTimer').onclick = () => { STATE.timerMode = true; showPage('modePage'); };
    $('backFromMode').onclick = () => showPage('homePage');
    $('backFromGame').onclick = () => {
        if (STATE.timerInterval) clearInterval(STATE.timerInterval);
        showPage('homePage');
    };

    // 模式选择
    document.querySelectorAll('.mode-card').forEach(card => {
        card.onclick = () => {
            const mode = card.dataset.mode;
            if (mode === 'ai') {
                STATE.mode = 'ai';
                STATE.opponentName = 'AI';
                startGame();
            } else if (mode === 'solo') {
                STATE.mode = 'solo';
                STATE.opponentName = '我(独自)';
                startGame();
            } else if (mode === 'bluetooth') {
                STATE.mode = 'bluetooth';
                $('bluetoothModal').classList.add('show');
            }
        };
    });

    // 蓝牙
    $('closeBtModal').onclick = () => $('bluetoothModal').classList.remove('show');
    // 简单 WebRTC 实现 (手动信令演示)
    let rtcOffer = null;
    const logBt = (msg) => {
        const el = $('btLog');
        el.innerHTML += `<div>${msg}</div>`;
        el.scrollTop = el.scrollHeight;
    };
    $('btCreateRoom').onclick = async () => {
        STATE.btIsHost = true;
        logBt('创建房间中...');
        const pc = new RTCPeerConnection();
        STATE.btPeerConnection = pc;
        const dc = pc.createDataChannel('game');
        STATE.btDataChannel = dc;
        dc.onopen = () => {
            STATE.btConnected = true;
            logBt('连接成功！');
            $('btStatusImg').src = 'https://xiaoye6661234.github.io/WordTest/BlueTooth.png';
            $('btStatusText').innerText = '已连接! 开始游戏';
            startGame();
        };
        dc.onmessage = (e) => handleBTMessage(e.data);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        rtcOffer = offer;
        const sdp = JSON.stringify(offer);
        logBt(`请复制以下SDP给加入方: ${sdp.substring(0,30)}...`);
        // 自动填入房间码
        $('btRoomCode').value = sdp;
        logBt('将房间码分享给另一个玩家');
    };
    $('btJoinRoom').onclick = async () => {
        STATE.btIsHost = false;
        const sdpString = $('btRoomCode').value.trim();
        if (!sdpString) { showMessage('请输入房间码'); return; }
        logBt('连接中...');
        try {
            const offer = JSON.parse(sdpString);
            const pc = new RTCPeerConnection();
            STATE.btPeerConnection = pc;
            pc.ondatachannel = (event) => {
                STATE.btDataChannel = event.channel;
                STATE.btDataChannel.onopen = () => {
                    STATE.btConnected = true;
                    logBt('连接成功！');
                    $('btStatusImg').src = 'https://xiaoye6661234.github.io/WordTest/BlueTooth.png';
                    $('btStatusText').innerText = '已连接! 开始游戏';
                    startGame();
                };
                STATE.btDataChannel.onmessage = (e) => handleBTMessage(e.data);
            };
            await pc.setRemoteDescription(offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            logBt(`发送应答... 将应答复制给对方`);
            const answerSdp = JSON.stringify(answer);
            $('btRoomCode').value = answerSdp;
            logBt('请将生成的应答码发给主机');
        } catch(e) {
            showMessage('连接失败，请检查房间码');
            logBt('连接失败: ' + e.message);
        }
    };

    function handleBTMessage(data) {
        try {
            const msg = JSON.parse(data);
            if (msg.type === 'word') {
                // 对方提交单词
                const word = msg.payload;
                processOpponentWord(word);
            } else if (msg.type === 'reset') {
                resetGame();
            } else if (msg.type === 'oppName') {
                oppName.innerText = msg.payload;
            } else if (msg.type === 'syncUsed') {
                // 同步已使用单词
                msg.payload.forEach(w => STATE.usedWords.add(w));
            } else if (msg.type === 'timerState') {
                timerText.innerText = `剩余时间: ${msg.payload}s`;
            }
        } catch(e) { console.warn('BT message error', e); }
    }

    function sendBTMessage(type, payload) {
        if (STATE.btDataChannel && STATE.btDataChannel.readyState === 'open') {
            STATE.btDataChannel.send(JSON.stringify({ type, payload }));
        }
    }

    // ================ 7. 游戏核心逻辑 ================
    function resetGame() {
        STATE.usedWords.clear();
        STATE.currentWord = 'good';
        STATE.myTurn = true;
        STATE.history = [];
        oppWordCard.innerText = 'good';
        oppStatus.innerText = '让我看看什么单词还没有出现...';
        oppFooter.innerText = '到你了！';
        playerInputDisplay.innerText = '';
        STATE.inputBuffer = '';
        clearInterval(STATE.timerInterval);
        if (STATE.timerMode) {
            STATE.timerSeconds = 10;
            timerText.innerText = '剩余时间: 10s';
        } else {
            timerText.innerText = '不限时';
        }
        renderHistory();
        if (STATE.mode === 'bluetooth' && STATE.btConnected) {
            sendBTMessage('syncUsed', Array.from(STATE.usedWords));
        }
    }

    function startGame() {
        showPage('gamePage');
        resetGame();
        if (STATE.mode === 'ai') {
            oppName.innerText = 'AI';
            oppAvatar.src = 'https://xiaoye6661234.github.io/WordTest/AI.png';
        } else if (STATE.mode === 'solo') {
            oppName.innerText = '单机';
            oppAvatar.src = 'https://xiaoye6661234.github.io/WordTest/默认avatar.jpg';
        } else if (STATE.mode === 'bluetooth') {
            oppName.innerText = '蓝牙对手';
            oppAvatar.src = 'https://xiaoye6661234.github.io/WordTest/默认avatar.jpg';
            if (STATE.btConnected) {
                sendBTMessage('oppName', '我');
                sendBTMessage('syncUsed', Array.from(STATE.usedWords));
            }
        }
        if (STATE.timerMode) {
            timerArea.style.display = 'flex';
            STATE.timerSeconds = 10;
            timerText.innerText = '剩余时间: 10s';
            startTimer();
        } else {
            timerArea.style.display = 'flex';
            timerText.innerText = '不限时';
        }
    }

    function startTimer() {
        clearInterval(STATE.timerInterval);
        if (!STATE.timerMode) return;
        STATE.timerSeconds = 10;
        timerText.innerText = `剩余时间: ${STATE.timerSeconds}s`;
        STATE.timerInterval = setInterval(() => {
            STATE.timerSeconds -= 1;
            timerText.innerText = `剩余时间: ${STATE.timerSeconds}s`;
            if (STATE.timerSeconds <= 0) {
                clearInterval(STATE.timerInterval);
                showMessage('时间到！游戏结束');
                resetGame();
                if (STATE.mode === 'bluetooth' && STATE.btConnected) {
                    sendBTMessage('reset', true);
                }
            }
        }, 1000);
    }

    // 用户提交单词
    function userSubmit() {
        if (!STATE.myTurn) {
            showMessage('等待对手...');
            return;
        }
        const word = STATE.inputBuffer.trim().toLowerCase();
        if (!word || word.length < 2) {
            showMessage('请输入至少2个字母的单词');
            return;
        }
        if (!WORDS.has(word)) {
            showMessage('该单词不存在或不在词库中');
            return;
        }
        if (STATE.usedWords.has(word)) {
            showMessage('该单词已使用过！');
            return;
        }
        // 检查接龙规则
        const lastChar = STATE.currentWord.slice(-1);
        if (word[0] !== lastChar) {
            showMessage(`单词必须以字母 "${lastChar.toUpperCase()}" 开头`);
            return;
        }

        // 有效
        STATE.usedWords.add(word);
        STATE.history.push({ player: '我', word: word });
        STATE.inputBuffer = '';
        playerInputDisplay.innerText = '';
        oppWordCard.innerText = word; // 显示用户刚输入的单词
        STATE.currentWord = word;
        STATE.myTurn = false;

        if (STATE.timerMode) {
            clearInterval(STATE.timerInterval);
            startTimer();
        }
        renderHistory();

        // 蓝牙同步
        if (STATE.mode === 'bluetooth' && STATE.btConnected) {
            sendBTMessage('word', word);
            sendBTMessage('syncUsed', Array.from(STATE.usedWords));
        }

        // 接下来轮到对手
        if (STATE.mode === 'ai') {
            oppStatus.innerText = 'AI正在思考...';
            oppFooter.innerText = 'AI 回合';
            $('aiLoadingMask').style.display = 'flex';
            setTimeout(() => {
                $('aiLoadingMask').style.display = 'none';
                aiTurn(word);
            }, 1000 + Math.random() * 1000);
        } else if (STATE.mode === 'bluetooth') {
            oppStatus.innerText = '等待对手...';
            oppFooter.innerText = '对手回合';
        } else { // solo
            // 单人模式直接切回玩家
            STATE.myTurn = true;
            oppStatus.innerText = '继续接龙';
            oppFooter.innerText = '到你了！';
        }
    }

    // AI 回合
    function aiTurn(lastWord) {
        const lastChar = lastWord.slice(-1);
        // 寻找符合条件的词
        let candidate = null;
        const candidates = [];
        // 从词库里找
        for (let w of WORDS) {
            if (w[0] === lastChar && !STATE.usedWords.has(w) && w.length > 1) {
                candidates.push(w);
                if (candidates.length > 200) break; // 避免卡顿
            }
        }
        if (candidates.length === 0) {
            showMessage('AI 找不到合适的词，你赢了！');
            resetGame();
            return;
        }
        candidate = candidates[Math.floor(Math.random() * candidates.length)];
        STATE.usedWords.add(candidate);
        STATE.history.push({ player: 'AI', word: candidate });
        STATE.currentWord = candidate;
        oppWordCard.innerText = candidate;
        STATE.myTurn = true;
        oppStatus.innerText = 'AI 已接：' + candidate;
        oppFooter.innerText = '到你了！';
        renderHistory();
        if (STATE.timerMode) {
            clearInterval(STATE.timerInterval);
            startTimer();
        }
        // 不用清除对手状态
    }

    // 处理对手(蓝牙)提交的单词
    function processOpponentWord(word) {
        STATE.usedWords.add(word);
        STATE.history.push({ player: '对手', word: word });
        STATE.currentWord = word;
        oppWordCard.innerText = word;
        STATE.myTurn = true;
        oppStatus.innerText = '对手已接：' + word;
        oppFooter.innerText = '到你了！';
        renderHistory();
        if (STATE.timerMode) {
            clearInterval(STATE.timerInterval);
            startTimer();
        }
    }

    // ================ 8. 自定义键盘 ================
    const keys = document.querySelectorAll('.kb-key');
    keys.forEach(k => {
        k.onclick = () => {
            if (k.id === 'keySubmit') {
                userSubmit();
                return;
            }
            if (k.id === 'keyBackspace') {
                STATE.inputBuffer = STATE.inputBuffer.slice(0, -1);
                playerInputDisplay.innerText = STATE.inputBuffer;
                return;
            }
            // 字母键
            const char = k.dataset.key;
            if (!char) return;
            if (STATE.inputBuffer.length < 20) {
                STATE.inputBuffer += char;
                playerInputDisplay.innerText = STATE.inputBuffer;
                // 打字特效：按键动画
                k.style.transform = 'scale(0.92)';
                setTimeout(() => k.style.transform = '', 120);
            }
        };
    });

    // ================ 9. 历史记录 ================
    function renderHistory() {
        historyList.innerHTML = '';
        if (STATE.history.length === 0) {
            historyList.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无记录</div>';
            return;
        }
        STATE.history.slice().reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const avatar = document.createElement('img');
            avatar.src = item.player === 'AI' ? 'https://xiaoye6661234.github.io/WordTest/AI.png' : 'https://xiaoye6661234.github.io/WordTest/默认avatar.jpg';
            avatar.alt = item.player;
            const nameSpan = document.createElement('span');
            nameSpan.textContent = item.player + ': ';
            const wordSpan = document.createElement('span');
            wordSpan.style.fontWeight = 'bold';
            wordSpan.textContent = item.word;
            div.appendChild(avatar);
            div.appendChild(nameSpan);
            div.appendChild(wordSpan);
            historyList.appendChild(div);
        });
    }

    $('historyBtn').onclick = () => {
        renderHistory();
        $('historyModal').classList.add('show');
    };
    $('closeHistoryModal').onclick = () => $('historyModal').classList.remove('show');

    // ================ 10. 底部公告信息 ================
    $('btnInfo').onclick = () => showMessage('词库包含超过11000个常用高频英语单词。\n蓝牙联机需要手动交换SDP邀请码。\nAI回合有1-2秒加载动画。\n定时模式10秒倒计时。');
    $('btnNotice').onclick = () => showMessage('欢迎使用单词接龙！\n点击"基础训练"或"定时训练"，\n选择模式开始游戏。\n规则：单词首字母必须接上一个单词的末尾字母。');

    // ================ 11. 初始化结束 ================
    console.log('游戏已就绪。');
</script>
</body>
</html>
